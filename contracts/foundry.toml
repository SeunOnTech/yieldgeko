[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["node_modules", "lib"]
auto_detect_solc = true
via_ir = true
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=node_modules/forge-std/src/",
    "ds-test/=node_modules/forge-std/lib/ds-test/src/",
    "delegation-framework/=lib/delegation-framework/src/",
    "@erc7579/=lib/delegation-framework/lib/erc7579-implementation/src/",
    "@account-abstraction/=lib/delegation-framework/lib/account-abstraction/contracts/"
]

[profile.fork]
src = "contracts"
test = "test"
out = "out"
libs = ["node_modules", "lib"]
auto_detect_solc = true
via_ir = true
optimizer = true
optimizer_runs = 200
eth_rpc_url = "https://arb1.arbitrum.io/rpc"
