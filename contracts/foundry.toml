[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["node_modules"]
solc = "0.8.34"
via_ir = true
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=node_modules/forge-std/src/",
    "ds-test/=node_modules/forge-std/lib/ds-test/src/"
]
