# ── YieldGeko nginx reverse proxy ─────────────────────────────────────────────
#
#  Sits in front of the agent SSE server (port 3001) and the Next.js frontend
#  (port 3000). Provides:
#    • TLS termination (swap in your cert paths below)
#    • SSE keep-alive tuning (long proxy_read_timeout)
#    • Per-IP SSE connection limit (prevents one client monopolising the 10k cap)
#    • Request-rate limiting on mutating API endpoints
#    • Gzip for JSON payloads
#    • Security headers
#
#  Deploy: sudo ln -s $(pwd)/nginx.conf /etc/nginx/sites-enabled/yieldgeko
#          sudo nginx -t && sudo systemctl reload nginx

# ── Connection and rate-limit zones ───────────────────────────────────────────
# Shared memory zones (defined in http block — paste into your nginx.conf http{}).

limit_conn_zone  $binary_remote_addr zone=sse_conn:10m;
limit_req_zone   $binary_remote_addr zone=api_req:10m  rate=20r/m;

# ── Upstream definitions ───────────────────────────────────────────────────────
upstream agent_sse {
  server 127.0.0.1:3001;
  keepalive 64;
}

upstream frontend {
  server 127.0.0.1:3000;
  keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
  listen      80;
  server_name app.yieldgeko.xyz;
  return      301 https://$host$request_uri;
}

# ── HTTPS — main vhost ────────────────────────────────────────────────────────
server {
  listen      443 ssl http2;
  server_name app.yieldgeko.xyz;

  # TLS — replace with your cert paths (Let's Encrypt / Certbot recommended)
  ssl_certificate     /etc/letsencrypt/live/app.yieldgeko.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.yieldgeko.xyz/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options           DENY                                  always;
  add_header X-Content-Type-Options    nosniff                               always;
  add_header Referrer-Policy           strict-origin-when-cross-origin       always;

  # Gzip for JSON/SSE text
  gzip            on;
  gzip_types      application/json text/event-stream text/plain;
  gzip_min_length 1024;

  # ── SSE /events endpoint ─────────────────────────────────────────────────
  location /events {
    # Max 10 SSE connections per IP (prevents one browser tab opening 10k streams)
    limit_conn sse_conn 10;

    proxy_pass         http://agent_sse;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   Connection        '';        # disable keep-alive upgrading for SSE

    # SSE-specific: long timeout so the stream doesn't close on idle
    proxy_read_timeout      3600s;
    proxy_buffering         off;           # must be off for SSE to stream in real time
    proxy_cache             off;
    chunked_transfer_encoding on;

    # Prevent nginx from buffering the event stream
    proxy_set_header X-Accel-Buffering no;
  }

  # ── Mutating API endpoints — rate-limited ────────────────────────────────
  location ~ ^/api/(withdraw|reset-user|pause-user|resume-user|force-migrate|patch-policy) {
    # 20 requests/minute per IP; burst of 5 with delay
    limit_req zone=api_req burst=5 delay=3;

    proxy_pass         http://agent_sse;
    proxy_http_version 1.1;
    proxy_set_header   Host            $host;
    proxy_set_header   X-Real-IP       $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # ── All other agent endpoints (/state, /health, /api/register, etc.) ────
  location ~ ^/(state|health|api)/ {
    proxy_pass         http://agent_sse;
    proxy_http_version 1.1;
    proxy_set_header   Host            $host;
    proxy_set_header   X-Real-IP       $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # ── Next.js frontend — everything else ──────────────────────────────────
  location / {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade         $http_upgrade;
    proxy_set_header   Connection      'upgrade';   # required for Next.js HMR websocket
    proxy_set_header   Host            $host;
    proxy_set_header   X-Real-IP       $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 30s;
  }
}
